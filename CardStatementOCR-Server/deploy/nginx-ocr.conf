# /etc/nginx/sites-available/ocr  (certificate: Let's Encrypt, see docs/INSTALL.md)
server {
    listen 443 ssl;
    server_name ocr.example.com;
    ssl_certificate     /etc/letsencrypt/live/ocr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocr.example.com/privkey.pem;
    client_max_body_size 30m;

    location /api/ {
        # Optional hardening (docs/INSTALL.md 7.5): only Business Central may call the API.
        # Run deploy/update-bc-allowlist.py once first, then uncomment:
        # include /etc/nginx/ocr-bc-allow.conf;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
    }
}
